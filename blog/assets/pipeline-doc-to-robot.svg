<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E11D48"/>
    </marker>
  </defs>
  <rect width="1200" height="950" fill="#FFFFFF"/>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">

    <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">From document to robot: the .ares pipeline</text>
    <text x="600" y="68" text-anchor="middle" font-size="14" fill="#475569">authored in the dashboard · compiled to checked-in Kotlin · gated by verification · executed fail-closed</text>

    <!-- feedback rail -->
    <path d="M 100,690 L 40,690 L 40,180 L 96,180" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
    <text x="28" y="440" font-size="12" fill="#E11D48" transform="rotate(-90 28 440)" text-anchor="middle">verification failure blocks the build — nothing stale reaches the robot</text>

    <!-- stage 1 -->
    <circle cx="80" cy="170" r="22" fill="#D97706"/>
    <text x="80" y="177" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <rect x="110" y="110" width="980" height="125" rx="12" fill="#FFFDF8" stroke="#FED7AA" stroke-width="2"/>
    <text x="140" y="140" font-size="16" font-weight="700" fill="#B45309">AUTHOR — ARES-Analytics · PathPlanner &amp; routine editor</text>
    <text x="140" y="168" font-size="13" fill="#334155">Draw waypoints on the field canvas and compose steps by picking actions from the catalog menu.</text>
    <text x="140" y="190" font-size="13" fill="#334155">Trajectory previews run the library&#8217;s own TrajectoryPlanner — what you preview is what the robot executes.</text>
    <rect x="790" y="200" width="285" height="26" rx="13" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="800" y="218" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#92400E">.ares/routines + catalogs</text>

    <line x1="600" y1="235" x2="600" y2="268" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 2 -->
    <circle cx="80" cy="335" r="22" fill="#4F46E5"/>
    <text x="80" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <rect x="110" y="275" width="980" height="125" rx="12" fill="#F8FAFF" stroke="#C7D2FE" stroke-width="2"/>
    <text x="140" y="305" font-size="16" font-weight="700" fill="#4338CA">GENERATE — :TeamCode:generateAresProject</text>
    <text x="140" y="333" font-size="13" fill="#334155">AresProjectCodegenCli compiles the JSON project into deterministic Kotlin (codegen format v8), checked in</text>
    <text x="140" y="355" font-size="13" fill="#334155">with SHA-256 content hashes. The same generator serves the FTC phone and the FRC RoboRIO.</text>
    <rect x="790" y="365" width="285" height="26" rx="13" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="800" y="383" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#3730A3">generated/GeneratedAresProject.kt</text>

    <line x1="600" y1="400" x2="600" y2="433" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 3 -->
    <circle cx="80" cy="500" r="22" fill="#475569"/>
    <text x="80" y="507" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <rect x="110" y="440" width="980" height="125" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="140" y="470" font-size="16" font-weight="700" fill="#334155">GATE — :TeamCode:verifyAresProject</text>
    <text x="140" y="498" font-size="13" fill="#334155">Compilation depends on the check: a stale generated file fails the build. validateRoutineSet cross-references</text>
    <text x="140" y="520" font-size="13" fill="#334155">every action key, pose, field bound and discovered hardware before anything is allowed to ship.</text>
    <rect x="790" y="530" width="285" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="800" y="548" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">CONTENT_SHA256 must match .ares</text>

    <line x1="600" y1="565" x2="600" y2="598" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 4 -->
    <circle cx="80" cy="665" r="22" fill="#0284C7"/>
    <text x="80" y="672" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
    <rect x="110" y="605" width="980" height="125" rx="12" fill="#F5FBFF" stroke="#BAE6FD" stroke-width="2"/>
    <text x="140" y="635" font-size="16" font-weight="700" fill="#075985">SIMULATE — headless dyn4j simulation, real OpModes</text>
    <text x="140" y="663" font-size="13" fill="#334155">ftc-mocks shadow the FTC SDK so the genuine OpModes run on CI machines. The sim writes a run summary</text>
    <text x="140" y="685" font-size="13" fill="#334155">(RMSE x / y / heading, peak current) and exits nonzero on failure — a number, not a vibe.</text>
    <rect x="790" y="695" width="285" height="26" rx="13" fill="#FFFFFF" stroke="#BAE6FD"/>
    <text x="800" y="713" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#075985">runSim · wire + SysId verification</text>

    <line x1="600" y1="730" x2="600" y2="763" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

    <!-- stage 5 -->
    <circle cx="80" cy="830" r="22" fill="#059669"/>
    <text x="80" y="837" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">5</text>
    <rect x="110" y="770" width="980" height="125" rx="12" fill="#F4FDF9" stroke="#A7F3D0" stroke-width="2"/>
    <text x="140" y="800" font-size="16" font-weight="700" fill="#065F46">RUN — on the field</text>
    <text x="140" y="828" font-size="13" fill="#334155">The driver picks routine + alliance on the INIT screen. RoutineCompiler builds the task graph and TaskExecutor</text>
    <text x="140" y="850" font-size="13" fill="#334155">drives it through the Redux store: 29.5 s deadline, fail-closed cancellation, pose handoff only on success.</text>
    <rect x="790" y="860" width="285" height="26" rx="13" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="800" y="878" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#065F46">ARES/Auto/Source = generated:&lt;sha256&gt;</text>

    <!-- feedback attach points on the rail -->
    <circle cx="100" cy="690" r="4" fill="#E11D48"/>
    <text x="120" y="935" font-size="12" font-style="italic" fill="#64748B">Any failure at stages 3–4 sends the author back to stage 1 with a concrete error — before hardware is involved.</text>
  </g>
</svg>
