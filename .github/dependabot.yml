version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint 8.x peers typescript >=4.8.4 <6.1.0, so 6.1+ and the
      # native TS 7 line fail Dependabot's peer check and abort the whole
      # weekly npm update run. 6.0.x patches stay eligible.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
