name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "22.13.1"
  PNPM_VERSION: "11.21.0"

jobs:
  verify:
    name: Verify, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run lint

      - name: Validate shared agent skills
        run: pnpm run validate:agents

      - name: Validate production deployment contract
        run: node scripts/verify-production-deployment.mjs --validate-contract

      - name: Run Cloud Functions ESLint
        run: pnpm --filter functions lint

      - name: Run TypeScript checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc --noEmit

      - name: Run production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Run frontend tests with coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run test:coverage

      - name: Run Cloud Functions tests with coverage
        run: pnpm --filter functions test:coverage

      - name: Verify public security configuration
        env:
          NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY"
          test -n "$NEXT_PUBLIC_RECAPTCHA_SITE_KEY"
          test -n "$NEXT_PUBLIC_GOOGLE_PICKER_API_KEY"

      - name: Build frontend
        env:
          NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
        run: pnpm run build

      - name: Enforce bundle budgets
        run: node scripts/check-bundle-size.mjs

      - name: Build Cloud Functions
        run: pnpm --filter functions build

      - name: Verify Hosting route status behavior
        run: pnpm exec firebase emulators:exec --only hosting,functions --project aresweb-ci "node scripts/check-hosting-emulator.mjs"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            dist/
            functions/lib/
          if-no-files-found: error
          retention-days: 3

  rules-tests:
    name: Firebase Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate supported local runtime contract
        run: pnpm run validate:runtime

      - name: Test Firestore and Storage rules
        run: pnpm run test:rules

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit

      - name: Run local E2E suite
        run: pnpm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-gate:
    name: Required Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - verify
      - rules-tests
      - e2e-tests
    steps:
      - name: Require every validation job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          RULES_RESULT: ${{ needs.rules-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$RULES_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "Validation failed: verify=$VERIFY_RESULT rules=$RULES_RESULT e2e=$E2E_RESULT"
            exit 1
          fi
          echo "All required validation jobs passed."

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify
      - test-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test-gate.result == 'success'
    environment:
      name: production
      url: https://aresfirst.org
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: aresfirst-portal
          workload_identity_provider: projects/205869391101/locations/global/workloadIdentityPools/aresweb-github/providers/github-production
          service_account: aresweb-github-deployer@aresfirst-portal.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "568.0.0"
          project_id: aresfirst-portal

      - name: Deploy isolated Functions before switching routes
        shell: bash
        run: |
          function_targets="$(node scripts/verify-production-deployment.mjs --print-deploy-targets)"
          pnpm exec firebase deploy --only "$function_targets" --project aresfirst-portal --non-interactive

      - name: Reject production Function, secret, resource, and IAM drift
        run: >-
          pnpm exec firebase functions:list --project aresfirst-portal --json |
          node scripts/verify-production-deployment.mjs --functions-json - --verify-iam

      - name: Switch Hosting routes and deploy verified rules
        run: pnpm exec firebase deploy --only hosting,firestore:rules,firestore:indexes,storage --project aresfirst-portal --non-interactive

      - name: Verify canonical production health
        run: node scripts/check-production-health.mjs --deployment-id "${{ github.sha }}"

      - name: Record deployment summary
        run: |
          echo "## Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://aresfirst.org" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: release-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drift contract: 8 Functions and 8 Cloud Run invoker policies" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live health: 10 canonical/Hosting checks" >> "$GITHUB_STEP_SUMMARY"
