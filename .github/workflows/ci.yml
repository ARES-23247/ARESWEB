name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "22.13.1"
  PNPM_VERSION: "11.21.0"

jobs:
  verify:
    name: Verify, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run lint

      - name: Run TypeScript checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc --noEmit

      - name: Run production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Run frontend tests with coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run test:coverage

      - name: Run Cloud Functions tests with coverage
        run: pnpm --filter functions test:coverage

      - name: Build frontend
        run: pnpm run build

      - name: Enforce bundle budgets
        run: node scripts/check-bundle-size.mjs

      - name: Build Cloud Functions
        run: pnpm --filter functions build

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            dist/
            functions/lib/
          if-no-files-found: error
          retention-days: 3

  rules-tests:
    name: Firebase Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Firestore and Storage rules
        run: pnpm run test:rules

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run local E2E suite
        run: pnpm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-gate:
    name: Required Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - verify
      - rules-tests
      - e2e-tests
    steps:
      - name: Require every validation job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          RULES_RESULT: ${{ needs.rules-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$RULES_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "Validation failed: verify=$VERIFY_RESULT rules=$RULES_RESULT e2e=$E2E_RESULT"
            exit 1
          fi
          echo "All required validation jobs passed."

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify
      - test-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test-gate.result == 'success'
    environment:
      name: production
      url: https://aresfirst.org
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: aresfirst-portal
          workload_identity_provider: projects/205869391101/locations/global/workloadIdentityPools/aresweb-github/providers/github-production
          service_account: aresweb-github-deployer@aresfirst-portal.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Deploy verified release to Firebase
        run: pnpm exec firebase deploy --only hosting,functions,firestore:rules,storage --project aresfirst-portal --non-interactive

      - name: Verify production health
        run: |
          for url in https://aresfirst-portal.web.app/ https://aresfirst-portal.web.app/api/simulations https://aresfirst-portal.web.app/api/finance?limit=1; do
            healthy=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --max-time 20 "$url" > /dev/null; then
                healthy=true
                break
              fi
              sleep 10
            done
            if [ "$healthy" != "true" ]; then
              echo "Production health check failed: $url"
              exit 1
            fi
          done

      - name: Record deployment summary
        run: |
          echo "## Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://aresfirst.org" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: release-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
