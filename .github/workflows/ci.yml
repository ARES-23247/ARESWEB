name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "22.13.1"
  PNPM_VERSION: "11.21.0"

jobs:
  verify:
    name: Verify, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run lint

      - name: Run TypeScript checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc --noEmit

      - name: Run production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Run frontend tests with coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run test:coverage

      - name: Run Cloud Functions tests with coverage
        run: pnpm --filter functions test:coverage

      - name: Build frontend
        run: pnpm run build

      - name: Enforce bundle budgets
        run: node scripts/check-bundle-size.mjs

      - name: Build Cloud Functions
        run: pnpm --filter functions build

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            dist/
            functions/lib/
          if-no-files-found: error
          retention-days: 3

  rules-tests:
    name: Firebase Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Firestore and Storage rules
        run: pnpm run test:rules

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run local E2E suite
        run: pnpm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-gate:
    name: Required Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - verify
      - rules-tests
      - e2e-tests
    steps:
      - name: Require every validation job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          RULES_RESULT: ${{ needs.rules-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$RULES_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "Validation failed: verify=$VERIFY_RESULT rules=$RULES_RESULT e2e=$E2E_RESULT"
            exit 1
          fi
          echo "All required validation jobs passed."

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify
      - test-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test-gate.result == 'success'
    environment:
      name: production
      url: https://aresfirst.org
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: .

      - name: Deploy verified release to Firebase
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          credentials_file="$(mktemp)"
          trap 'rm -f "$credentials_file"' EXIT
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          pnpm exec firebase deploy --only hosting,functions,firestore:rules,storage --project aresfirst-portal --non-interactive

      - name: Verify production health
        run: |
          for url in https://aresfirst.org/ https://aresfirst.org/api/simulations https://aresfirst.org/api/finance?limit=1; do
            healthy=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --max-time 20 "$url" > /dev/null; then
                healthy=true
                break
              fi
              sleep 10
            done
            if [ "$healthy" != "true" ]; then
              echo "Production health check failed: $url"
              exit 1
            fi
          done

      - name: Record deployment summary
        run: |
          echo "## Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://aresfirst.org" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: release-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
