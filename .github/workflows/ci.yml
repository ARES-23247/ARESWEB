name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.21.0"

jobs:
  verify:
    name: Verify, Test & Build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run lint

      - name: Validate shared agent skills
        run: pnpm run validate:agents

      - name: Enforce API mutation route security invariants
        run: pnpm run check:route-security

      - name: Validate security observability contract
        run: pnpm run validate:security-observability

      - name: Validate Academy curriculum sources and provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run content:verify

      - name: Validate exact Academy release batches and review digests
        run: pnpm run content:release-validate

      - name: Run content migration and deployment contract tests
        run: pnpm run test:content-migration

      - name: Validate production deployment contract
        run: node scripts/verify-production-deployment.mjs --validate-contract

      - name: Validate game Cloud Run cost contract
        run: pnpm run validate:game-deployment

      - name: Validate Cloud Functions npm deployment lock
        run: pnpm run validate:functions-deploy-lock

      - name: Run Cloud Functions ESLint
        run: pnpm --filter functions lint

      - name: Run TypeScript checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run typecheck

      - name: Run production dependency audit
        run: node scripts/run-production-audit.mjs

      - name: Run frontend tests with coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run test:coverage

      - name: Run Cloud Functions tests with coverage
        run: pnpm --filter functions test:coverage

      - name: Verify public security configuration
        env:
          NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY"
          test -n "$NEXT_PUBLIC_GOOGLE_PICKER_API_KEY"

      - name: Build frontend
        env:
          NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
        run: pnpm run build

      - name: Enforce bundle budgets
        run: node scripts/check-bundle-size.mjs

      - name: Build Cloud Functions
        run: pnpm --filter functions build

      - name: Verify Hosting route status behavior
        run: pnpm exec firebase emulators:exec --only hosting,functions --project aresweb-ci "node scripts/check-hosting-emulator.mjs"

  rules-tests:
    name: Firebase Rules Emulator Tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate supported local runtime contract
        run: pnpm run validate:runtime

      - name: Test Firestore and Storage rules
        run: pnpm run test:rules

      - name: Test authorization against the Firestore emulator
        run: pnpm run test:functions-emulator

  e2e-tests:
    name: Playwright E2E Tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The official image ships every browser and its system libraries, so the
    # job never touches apt — hosted-runner package mirrors stalled three
    # times today and burned entire job budgets in Ign lines.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Firefox's sandbox needs user namespaces (clone), which the default
      # container seccomp profile denies with EPERM.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local E2E suite
        # Steps run as root while the runner pins HOME to /github/home
        # (owned by pwuser); Firefox rejects that combination. /root is
        # owned by the effective user.
        env:
          HOME: /root
        run: pnpm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-gate:
    name: Required Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name != 'push'
    needs:
      - verify
      - rules-tests
      - e2e-tests
    steps:
      - name: Require every validation job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          RULES_RESULT: ${{ needs.rules-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$RULES_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "Validation failed: verify=$VERIFY_RESULT rules=$RULES_RESULT e2e=$E2E_RESULT"
            exit 1
          fi
          echo "All required validation jobs passed."

  release-build:
    name: Build Protected Master Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a protected pull-request merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          merged_pr_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"master\" and .merge_commit_sha == \"${GITHUB_SHA}\")] | length"
          )"

          if [ "$merged_pr_count" != "1" ]; then
            echo "Release refused: ${GITHUB_SHA} must be the result of exactly one merged pull request into master."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public security configuration
        env:
          NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY"
          test -n "$NEXT_PUBLIC_GOOGLE_PICKER_API_KEY"

      - name: Build frontend release
        env:
          NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
        run: pnpm run build

      - name: Enforce release bundle budgets
        run: node scripts/check-bundle-size.mjs

      - name: Build Cloud Functions release
        run: pnpm --filter functions build

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            dist/
            functions/lib/
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - release-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release-build.result == 'success'
    environment:
      name: production
      url: https://aresfirst.org
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: aresfirst-portal
          workload_identity_provider: projects/205869391101/locations/global/workloadIdentityPools/aresweb-github/providers/github-production
          service_account: aresweb-github-deployer@aresfirst-portal.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "568.0.0"
          project_id: aresfirst-portal

      - name: Verify least-privilege build identity
        run: node scripts/verify-production-deployment.mjs --verify-build-iam

      - name: Validate game Cloud Run cost contract
        run: pnpm run validate:game-deployment

      - name: Build and publish immutable game service image
        shell: bash
        run: |
          game_image="$(node scripts/verify-game-cloud-run.mjs --print-image-uri "${{ github.sha }}")"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --file functions/Dockerfile.game --tag "$game_image" .
          docker push "$game_image"
          echo "GAME_IMAGE=$game_image" >> "$GITHUB_ENV"

      - name: Deploy bounded game Cloud Run service before switching routes
        run: >-
          gcloud run deploy aresweb-game-api
          --project aresfirst-portal
          --region us-central1
          --platform managed
          --image "${{ env.GAME_IMAGE }}"
          --service-account aresweb-game-runtime@aresfirst-portal.iam.gserviceaccount.com
          --set-secrets ABUSE_HMAC_SECRET=ABUSE_HMAC_SECRET:latest,ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest
          --set-env-vars ENFORCE_APP_CHECK=true,NODE_ENV=production
          --cpu 0.08
          --memory 256Mi
          --concurrency 1
          --min-instances 0
          --max-instances 1
          --timeout 10s
          --execution-environment gen1
          --cpu-throttling
          --no-cpu-boost
          --ingress all
          --allow-unauthenticated
          --quiet

      - name: Reject production game service resource and IAM drift
        shell: bash
        run: |
          gcloud run services describe aresweb-game-api --project aresfirst-portal --region us-central1 --format=json \
            | node scripts/verify-game-cloud-run.mjs --service-json -
          revision_name="$(gcloud run services describe aresweb-game-api --project aresfirst-portal --region us-central1 --format='value(status.latestReadyRevisionName)')"
          gcloud run revisions describe "$revision_name" --project aresfirst-portal --region us-central1 --format=json \
            | node scripts/verify-game-cloud-run.mjs --revision-json -
          gcloud run services get-iam-policy aresweb-game-api --project aresfirst-portal --region us-central1 --format=json \
            | node scripts/verify-game-cloud-run.mjs --iam-json -

      - name: Deploy isolated Functions before switching routes
        shell: bash
        run: |
          function_targets="$(node scripts/verify-production-deployment.mjs --print-deploy-targets)"
          pnpm exec firebase deploy --only "$function_targets" --project aresfirst-portal --non-interactive

      - name: Reject production Function, secret, resource, and IAM drift
        run: >-
          pnpm exec firebase functions:list --project aresfirst-portal --json |
          node scripts/verify-production-deployment.mjs --functions-json - --verify-iam

      - name: Switch Hosting routes and deploy verified rules
        run: pnpm exec firebase deploy --only hosting,firestore:rules,firestore:indexes,storage --project aresfirst-portal --non-interactive

      - name: Verify deployed Firebase surface
        run: >-
          node scripts/check-production-health.mjs
          --deployment-id "${{ github.sha }}"
          --primary-origin "https://aresfirst-portal.web.app"

      # Cloudflare intentionally rejects some GitHub-hosted runner IPs. Keep
      # this probe visible without making an edge reputation decision override
      # the strict Firebase deployment gate above. Google Cloud Monitoring is
      # the authoritative continuous check for the canonical public domain.
      - name: Report canonical domain reachability from GitHub runner
        shell: bash
        run: |
          set +e
          canonical_status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 20 https://aresfirst.org/)"
          canonical_exit=$?
          set -e

          if [[ "$canonical_exit" -eq 0 && "$canonical_status" =~ ^[23][0-9]{2}$ ]]; then
            canonical_result="reachable from this GitHub runner (HTTP $canonical_status)"
          else
            canonical_result="non-authoritative runner probe returned HTTP ${canonical_status:-000} (curl exit $canonical_exit); Google Cloud Monitoring remains authoritative"
          fi

          echo "Canonical domain: $canonical_result"
          echo "- Canonical runner probe: $canonical_result" >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployment summary
        run: |
          echo "## Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://aresfirst.org" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: release-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drift contract: build identity, 11 Functions, 11 Function invoker policies, and the bounded game Cloud Run service" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live health: 15 strict Firebase surface checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical domain: continuously checked by Google Cloud Monitoring" >> "$GITHUB_STEP_SUMMARY"

  production-browser-smoke:
    name: Production Browser Security Smoke
    runs-on: ubuntu-latest
    needs:
      - deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.deploy-production.result == 'success'
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install browser-smoke dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production GA4 and App Check without storing inquiry data
        run: >-
          node scripts/check-production-browser.mjs
          --deployment-id "${{ github.sha }}"
          --origin "https://aresfirst-portal.web.app"
