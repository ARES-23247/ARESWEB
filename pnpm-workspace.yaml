packages:
  - "."
  - "functions"
  - "packages/*"
optimisticRepeatInstall: false
overrides:
  dompurify: ^3.4.17
  monaco-editor>dompurify: ^3.4.17
  hono: ^4.13.11
  js-yaml: ^4.3.2
  morgan: ^1.12.1
  colord: ^2.9.4
  # Firebase CLI's CSV importer uses the supported CommonJS parse export.
  # 7.0.2 closes prototype replacement through user-supplied column names.
  csv-parse: ^7.0.2
  'nanoid@<3.3.18': ^3.3.18
  # Pub/Sub only consumes the stable W3CTraceContextPropagator export.
  '@google-cloud/pubsub>@opentelemetry/core': ^2.8.0
  '@hono/node-server': ^2.1.3
  body-parser: ^1.20.9
  zod: ^4.6.6
  re2js: ^2.8.7
  'brace-expansion@<2.1.7': ^2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  fast-uri: ^3.1.9
  ip-address: ^10.7.4
  # GHSA-m9gg-hp2v-232j / GHSA-f596-whhp-79r4. The web SDK pins ~1.9 (used only
  # by its Node build, including rules tests); google-gax uses the 1.14 line.
  '@grpc/grpc-js@<1.13.6': ~1.13.6
  '@grpc/grpc-js@>=1.14.0 <1.14.5': ~1.14.5
  # GHSA-xjh9-v7x6-24jw / GHSA-x8mw-p69m-v3mx via firebase-admin multipart parsing.
  '@fastify/busboy': ^3.2.1
  fast-xml-parser: ^5.10.1
  protobufjs: ^7.6.5
  uuid: ^11.1.1
  qs: ^6.16.1
  # GHSA-jqcg-44mw-7w3h via Express trust-proxy address parsing.
  proxy-addr: ^2.0.8
  # GHSA-6qxp-vccf-f47h via the @google/genai MCP peer (it accepts ^1.25.2).
  '@modelcontextprotocol/sdk': ^1.31.0
  'undici@<6.29.1': ^6.29.1
  'undici@>=8.0.0 <8.12.2': ^8.12.2
  basic-ftp: ^6.2.1
  source-map-js: ^1.2.2
  compression: ^1.8.2
  serialize-javascript: ^7.1.3
  'glob@>=9.0.0 <=14.0.1': ^14.0.2
  'minimatch@>=9.0.0 <11.0.1': ^11.0.1

patchedDependencies:
  # Superstatic's Hosting header matcher expects URL/glob separators on Windows too.
  glob-slash@1.0.0: patches/glob-slash@1.0.0.patch
  # firebase-tools still loads stream-json through its CommonJS 1.x paths,
  # which are incompatible with the ESM-only fixed major. Backport the
  # upstream nesting-depth guard for GHSA-528h-pc64-c93x until it upgrades.
  stream-json@1.9.1: patches/stream-json@1.9.1.patch

allowBuilds:
  '@google/genai': true
  '@firebase/util': true
  protobufjs: true
  re2: true
  sharp: true
