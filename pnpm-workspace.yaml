packages:
  - "."
  - "functions"
  - "packages/*"
optimisticRepeatInstall: false
overrides:
  dompurify: ^3.4.13
  monaco-editor>dompurify: ^3.4.13
  hono: ^4.12.34
  '@hono/node-server': ^2.0.5
  body-parser: ^1.20.6
  'brace-expansion@<2.1.4': ^2.1.4
  fast-uri: ^3.1.6
  ip-address: ^10.3.1
  fast-xml-parser: ^5.10.1
  protobufjs: ^7.6.5
  uuid: ^11.1.1
  qs: ^6.16.0

patchedDependencies:
  # firebase-tools still loads stream-json through its CommonJS 1.x paths,
  # which are incompatible with the ESM-only fixed major. Backport the
  # upstream nesting-depth guard for GHSA-528h-pc64-c93x until it upgrades.
  stream-json@1.9.1: patches/stream-json@1.9.1.patch

allowBuilds:
  '@google/genai': true
  '@firebase/util': true
  protobufjs: true
  re2: true
  sharp: true
